name: Local delivery
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: pip install -r requirements-dev.lock && pip install --no-deps -e .
      - run: ruff check .
      - run: pytest -q
      - run: python scripts/benchmark.py
      - run: playwright install --with-deps chromium
      - run: python scripts/e2e.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: artifacts/
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --profile observability config --quiet
      - run: docker compose up --build -d --wait
      - name: Exercise container API
        run: |
          curl --fail http://127.0.0.1:8000/health/ready
          curl --fail -H 'Content-Type: application/json' --data-binary @examples/01-energy.json http://127.0.0.1:8000/api/runs > result.json
          python -c "import json; assert json.load(open('result.json'))['verdict'] == 'ACCEPTED'"
      - run: docker compose logs
        if: always()
      - run: docker compose down -v
        if: always()
