name: Local delivery
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.12'
            e2e: true
          - os: ubuntu-latest
            python-version: '3.13'
            e2e: false
          - os: windows-latest
            python-version: '3.13'
            e2e: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run build && npm test
        working-directory: frontend
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: pip install -r requirements-dev.lock && pip install --no-deps -e .
      - run: ruff check .
      - run: pytest -q
      - run: python scripts/benchmark.py
      - run: python scripts/eval_bench.py --build
      - run: python scripts/eval_bench.py --quick
      - if: ${{ matrix.e2e }}
        run: playwright install --with-deps chromium
      - if: ${{ matrix.e2e }}
        run: python scripts/e2e.py
      - uses: actions/upload-artifact@v4
        if: ${{ always() && matrix.e2e }}
        with:
          name: browser-evidence
          path: artifacts/
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run build
        working-directory: frontend
      - run: test -f natalia/web/index.html
      - run: docker compose --profile observability config --quiet
      - run: docker compose up --build -d --wait
      - name: Exercise container API
        run: |
          curl --fail http://127.0.0.1:8000/health/ready
          curl --fail http://127.0.0.1:8000/ | grep -q 'id="root"'
          curl --fail -H 'Content-Type: application/json' --data-binary @examples/01-energy.json http://127.0.0.1:8000/api/runs > result.json
          python -c "import json; assert json.load(open('result.json', encoding='utf-8'))['verdict'] == 'ACCEPTED'"
      - run: docker compose ps -a
        if: always()
      - run: docker compose logs
        if: always()
      - run: docker compose down -v
        if: always()
