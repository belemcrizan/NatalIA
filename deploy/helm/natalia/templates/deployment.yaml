apiVersion: apps/v1
kind: Deployment
metadata:
  name: natalia
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: natalia
  template:
    metadata:
      labels:
        app: natalia
    spec:
      containers:
        - name: natalia
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8000
          env:
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
          volumeMounts:
            - name: data
              mountPath: /data
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: natalia-data
---
apiVersion: v1
kind: Service
metadata:
  name: natalia
spec:
  selector:
    app: natalia
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 8000
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: natalia-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
