[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "natalia-local"
version = "0.3.0"
description = "Local evidence-first verification workbench for physics claims"
requires-python = ">=3.12"
dependencies = ["fastapi==0.141.1", "uvicorn==0.52.4", "pydantic==2.13.5", "sympy==1.14.0", "z3-solver==5.1.0.0", "prometheus-client==0.26.0"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "httpx==0.28.1", "ruff==0.16.7", "playwright==1.62.0"]

[tool.setuptools.packages.find]
include = ["natalia*"]

[tool.setuptools.package-data]
natalia = ["static/*", "examples/*.json", "bench_data/v0.1/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
